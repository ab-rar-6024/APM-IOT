user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout  65;

  # Hide backend identity
  server_tokens off;

  # ---- Load balancing across app replicas ----
  # least_conn sends new requests to the replica with the fewest
  # active connections, so traffic spreads out as N users show up.
  upstream iot_apm_app {
    least_conn;
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    server app3:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # ---- Rate limiting / basic DoS protection ----
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  log_format main '$remote_addr - $status "$request" "$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  server {
    listen 80;
    server_name _;

    limit_req zone=general burst=40 nodelay;
    limit_conn perip 30;

    # ---- Security headers (defense in depth alongside Next.js headers()) ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block common exploit probes
    location ~* /(\.env|\.git|wp-admin|wp-login\.php|xmlrpc\.php)$ {
      deny all;
      return 404;
    }

    location /_next/static/ {
      proxy_pass http://iot_apm_app;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://iot_apm_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
